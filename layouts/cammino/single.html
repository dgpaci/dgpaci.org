{{ define "main" }}
<article class="prose">
  <header class="page-head">
    <p class="kicker"><a href="{{ .Parent.RelPermalink }}">Camino de Santiago</a> · {{ .Date | time.Format "2 January 2006" }}</p>
    <h1>Día {{ .Params.day }}: {{ .Params.route }}</h1>
  </header>
  {{ .Content }}
  <nav class="pager">
    {{ with .NextInSection }}<a href="{{ .RelPermalink }}">← Día {{ .Params.day }}</a>{{ else }}<span></span>{{ end }}
    {{ with .PrevInSection }}<a href="{{ .RelPermalink }}">Día {{ .Params.day }} →</a>{{ end }}
  </nav>
  <nav class="pager">
    <a class="back" href="{{ .Parent.RelPermalink }}">← Torna al Cammino</a>
  </nav>
</article>
{{ end }}

baseURL = "https://dgpaci.org/"
locale = "it-IT"
defaultContentLanguage = "it"
title = "Davide Paci"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Economista di formazione, marketer per dieci anni, oggi a metà tra il cliente e il codice. Qui racconto cosa faccio, cosa costruisco e dove cammino."
  author = "Davide Paci"
  motto = "Fino all’anno scorso avevo un solo difetto. Ero presuntuoso."
  mottoAuthor = "Woody Allen"
  github = "https://github.com/dgpaci"
  linkedin = "https://www.linkedin.com/in/dgpaci"
  pasamedia = "https://pasamedia.it"
  # Riga sotto il saluto in home: le parole che un recruiter cerca a colpo d’occhio.
  focus = ["Delivery", "PRINCE2", "Python", "AI applicata"]

[menus]
  [[menus.main]]
    name = "Chi sono"
    pageRef = "/chi-sono"
    weight = 10
  [[menus.main]]
    name = "Progetti"
    pageRef = "/progetti"
    weight = 20
  # "Mestiere" si aggiunge da sé (front matter di content/mestiere/_index.md) quando la sezione
  # esce dalla bozza.
  [[menus.main]]
    name = "Cammino"
    pageRef = "/cammino"
    weight = 40
  [[menus.main]]
    identifier = "altro"
    name = "Altro"
    pageRef = "/altro"
    weight = 50
  [[menus.main]]
    name = "Note"
    pageRef = "/note"
    parent = "altro"
    weight = 10
  [[menus.main]]
    name = "Cinema"
    pageRef = "/cinema"
    parent = "altro"
    weight = 20
  [[menus.main]]
    name = "Citazioni"
    pageRef = "/citazioni"
    parent = "altro"
    weight = 30
  [[menus.main]]
    name = "Pensieri"
    pageRef = "/pensieri"
    parent = "altro"
    weight = 40

[markup.goldmark.renderer]
  unsafe = false

# Risolve i link interni "/chi-sono/" anche quando il sito vive in un sottopercorso.
[markup.goldmark.renderHooks.link]
  useEmbedded = "fallback"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
